name: Build Unsigned IPA for SideStore

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-ipa.yml"

permissions:
  contents: write

concurrency:
  group: build-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archive Relay (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode (prefer Xcode 26 for Liquid Glass)
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E 'Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -n 1 || true)
          if [ -n "${NEWEST}" ]; then
            echo "Selecting ${NEWEST}"
            sudo xcode-select -s "${NEWEST}/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          cd ios
          xcodegen generate
          ls -la

      - name: Archive (no code signing)
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          mkdir -p build
          xcodebuild archive \
            -project Relay.xcodeproj \
            -scheme Relay \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/Relay.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | tee build/xcodebuild.log

      - name: Package Relay-unsigned.ipa
        run: |
          set -euo pipefail
          cd ios
          APP_PATH="build/Relay.xcarchive/Products/Applications/Relay.app"
          if [ ! -d "${APP_PATH}" ]; then
            echo "::error::Relay.app not found in archive"
            find build -maxdepth 5 -name "*.app" -print
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "${APP_PATH}" build/Payload/
          cd build
          /usr/bin/zip -qry Relay-unsigned.ipa Payload
          ls -lh Relay-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relay-unsigned-ipa
          path: ios/build/Relay-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          NOTES="Auto-built unsigned iOS IPA for SideStore / Feather.\n\n- Commit: \`${SHORT_SHA}\`\n- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh release view latest >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f latest "${GITHUB_SHA}"
            git push -f origin refs/tags/latest
            gh release upload latest ios/build/Relay-unsigned.ipa --clobber
            gh release edit latest --title "Relay Latest (${SHORT_SHA})" --notes "$(printf '%b' "$NOTES")"
          else
            gh release create latest ios/build/Relay-unsigned.ipa --target "${GITHUB_SHA}" --title "Relay Latest (${SHORT_SHA})" --notes "$(printf '%b' "$NOTES")"
          fi
