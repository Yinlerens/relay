name: Build Unsigned IPA for SideStore

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-ipa.yml"
      - ".github/scripts/generate_sidestore_source.py"

permissions:
  contents: write

concurrency:
  group: build-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Archive Relay (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode (prefer Xcode 26 for Liquid Glass)
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -E 'Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -n 1 || true)
          if [ -n "${NEWEST}" ]; then
            echo "Selecting ${NEWEST}"
            sudo xcode-select -s "${NEWEST}/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          cd ios
          xcodegen generate
          ls -la

      - name: Run iOS Unit Tests
        run: |
          set -euo pipefail
          cd ios
          mkdir -p build
          SIM_UDID=$(python3 - <<'PY'
          import json, re, subprocess
          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          candidates = []
          for runtime, devs in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              nums = [int(x) for x in re.findall(r"(\d+)", runtime)]
              ver = tuple(nums[:3]) if nums else (0,)
              for d in devs:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      candidates.append((ver, "Pro" in d.get("name", ""), d["udid"], d["name"], runtime))
          if not candidates:
              raise SystemExit("No available iOS Simulator iPhone device found")
          candidates.sort(reverse=True)
          best = candidates[0]
          import sys
          print(f"Using simulator: {best[3]} ({best[4]}) -> {best[2]}", file=sys.stderr)
          print(best[2])
          PY
          )
          xcodebuild test \
            -project Relay.xcodeproj \
            -scheme Relay \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | tee build/xctest.log

      - name: Archive (no code signing)
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          mkdir -p build
          xcodebuild archive \
            -project Relay.xcodeproj \
            -scheme Relay \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/Relay.xcarchive" \
            MARKETING_VERSION="1.0.${GITHUB_RUN_NUMBER}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            | tee build/xcodebuild.log

      - name: Package Relay-unsigned.ipa
        run: |
          set -euo pipefail
          cd ios
          APP_PATH="build/Relay.xcarchive/Products/Applications/Relay.app"
          if [ ! -d "${APP_PATH}" ]; then
            echo "::error::Relay.app not found in archive"
            find build -maxdepth 5 -name "*.app" -print
            exit 1
          fi
          SHORT_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "${APP_PATH}/Info.plist")
          BUILD_VER=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "${APP_PATH}/Info.plist")
          echo "Packaged Relay.app version=${SHORT_VER} (${BUILD_VER})"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "${APP_PATH}" build/Payload/
          cd build
          /usr/bin/zip -qry Relay-unsigned.ipa Payload
          ls -lh Relay-unsigned.ipa

      - name: Generate SideStore source.json
        run: |
          set -euo pipefail
          cp ios/Relay/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png ios/build/icon.png
          python3 .github/scripts/generate_sidestore_source.py

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Relay-unsigned-ipa
          path: ios/build/Relay-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          NOTES="Auto-built unsigned iOS IPA for SideStore / Feather.\n\n- Version: \`${VERSION}\` (build ${GITHUB_RUN_NUMBER})\n- Commit: \`${SHORT_SHA}\`\n- SideStore Source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/latest/source.json\n- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if gh release view latest >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f latest "${GITHUB_SHA}"
            git push -f origin refs/tags/latest
            gh release upload latest ios/build/Relay-unsigned.ipa ios/build/source.json ios/build/icon.png --clobber
            gh release edit latest --title "Relay ${VERSION} (${SHORT_SHA})" --notes "$(printf '%b' "$NOTES")"
          else
            gh release create latest ios/build/Relay-unsigned.ipa ios/build/source.json ios/build/icon.png --target "${GITHUB_SHA}" --title "Relay ${VERSION} (${SHORT_SHA})" --notes "$(printf '%b' "$NOTES")"
          fi
